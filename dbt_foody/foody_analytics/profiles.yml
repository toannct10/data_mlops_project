foody_analytics:
  target: prod

  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"

      role: "{{ env_var('SNOWFLAKE_DBT_ROLE', 'FOODY_DBT') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'FOODY_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'FOODY') }}"
      schema: "{{ env_var('SNOWFLAKE_STAGING_SCHEMA', 'STAGING') }}"

      session_parameters:
        USE_CACHED_RESULT: false
      threads: 4
      client_session_keep_alive: false